<!DOCTYPE HTML>
<html>
    <head>
        <title>Using Figure &amp; Figcaption in HTML</title>
        <style>
            figure {
                padding: 5px;
                border: 1px solid #000;
                width: 45%;
                margin: 20px auto;
            }

            figcaption {
                color: white;
                background-color: #000;
                padding: 5px;
                font-size: 20px;
            }
        </style>
    </head>
    <body>
        <h1> Using Figure &amp; Figcaption in HTML</h1>

        <h2>Beautiful Masjids in Pakistan</h2>

        <figure>
            <img src="13.1.Faisal Masjid.jpg" alt="Faisal Masjid Islamabad" width="100%" height="400">
            <figcaption>Faisal Masjid Islamabad</figcaption>
        </figure>

        <figure>
            <img src="13.2. Badshahi Masjid.jpg" alt="Badshahi Masjid Lahore" width="100%" height="400">
            <figcaption>Badshahi Masjid Lahore</figcaption>
        </figure>

        <figure>
            <img src="13.3. Wazir Khan Masjid.jpg" alt="Wazir Khan Masjid Lahore" width="100%" height="400">
            <figcaption>Wazir Khan Masjid Lahore</figcaption>
        </figure>
    </body>
</html>
